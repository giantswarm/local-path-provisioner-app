name: "Validate sync diffs"

on:
  - pull_request

jobs:
  check:
    name: "Run sync.sh"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download vendir
        uses: giantswarm/install-binary-action@c94c7adadeb14af4bdbdd601f9a6e7f69638134c # v4.0.0
        with:
          binary: "vendir"
          version: "0.45.0"
          download_url: "https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Download jq
        uses: giantswarm/install-binary-action@c94c7adadeb14af4bdbdd601f9a6e7f69638134c # v4.0.0
        with:
          binary: "jq"
          version: "jq-1.8.1"
          download_url: "https://github.com/jqlang/jq/releases/download/${version}/jq-linux-amd64"
          binary_new_name: "jq"
          smoke_test: "${binary} --version"

      - name: Run sync.sh
        run: |
          ./sync/sync.sh

      - name: Check there is no diff
        run: |
          git diff --exit-code
